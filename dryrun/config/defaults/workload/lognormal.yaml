# Output-length distribution.
source: distributions

output:
  name: lognormal

  # Number of request lengths to sample.
  n: 200

  # RNG seed.
  seed: 42

  # Mean of the underlying normal (log-space).
  mu: 4.0

  # Stddev of the underlying normal (log-space).
  sigma: 1.0

# Prompt-length distribution. Defaults to a fixed length for every request.
prompt:
  name: fixed

  # Number of request lengths to sample.
  n: 200

  # RNG seed.
  seed: 42

  # Fixed prompt length in tokens.
  lo: 512
  hi: 512
