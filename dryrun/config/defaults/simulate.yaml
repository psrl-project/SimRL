defaults:
  - _self_
  - rollout_cost: roofline
  - policy: psrl
  - workload: uniform
  - training_cost: fixed

# Basic settings of one simulation job.
job:
  # Number of training versions (steps) to simulate.
  n_versions: 20

  # Prompt groups consumed per training step. Responses per step is
  # batch_size * group_size.
  batch_size: 8

  # Responses sampled per prompt (the recipe's rollout_n). null reads it from
  # the workload; only a trace carries real groups.
  group_size: null

  # Maximum allowed staleness of consumed training data.
  # Used as a version bound by areal, psrl, and roll. For verl it is the
  # sample-overage ratio fallback when policy.staleness_threshold is null.
  # Ignored by slime: its bound is policy.update_weights_interval.
  max_staleness: 2

  # Per-request prompt cap in tokens. Sampled prompts longer than this are
  # truncated. null = no cap.
  max_prompt_length: null

  # Per-request output cap in tokens. Generation stops at this length.
  # null = no cap.
  max_output_length: null

# Rollout engine settings.
rollout:
  # Number of rollout engine instances.
  n_instances: 1

  # Abort in-flight rollouts when a new weight version is published.
  partial_rollout: true

  # Per-step token budget of one instance (max tokens per engine step).
  token_budget: 8192

  # KV cache capacity in blocks, the denominator of every reported kv_cache_usage.
  # Leaving it at this placeholder makes the simulated KV curve incomparable with a
  # measured one; prefer kv_cache_sizing below.
  kv_blocks: 100000

  # Tokens per KV block.
  block_size: 16
  enable_prefix_caching: true

  # Where kv_blocks should come from instead of the literal above. Leaving
  # model_path null keeps the literal.
  kv_cache_sizing:
    # A HuggingFace checkpoint dir, used to derive capacity the way vLLM does from
    # the model's KV geometry and the budget below. Overestimates by ~3%, because
    # vLLM also subtracts a measured non-KV peak no config file reveals; set
    # non_kv_overhead_bytes to fold that in once known.
    model_path: null
    gpu_memory_mib: 97871
    gpu_memory_utilization: 0.9
    tp_size: 1
    parameter_count: null
    non_kv_overhead_bytes: 0

  # Max sequences in the running batch (vLLM max_num_seqs). null = unlimited.
  max_concurrency: null

  # Admission gates applied when a request is offered to an instance.
  admission_control:
    # Reject new requests when reserved KV would exceed capacity.
    reject_if_kv_full: true

    # Reject new requests while any request is still waiting.
    reject_if_waiting: false

    # Reject new requests when the running batch is already at max_concurrency.
    reject_if_running_full: false

  # Cross-instance routing. A request is admitted into the router queue and
  # placed on an instance when one can take it, so a busy fleet produces queue
  # depth rather than a rejected admission.
  router:
    # Which instance a queued request is sent to:
    #   request_num_balance  fewest in-flight requests (the matched PSRL run's)
    #   round_robin          cycle through eligible instances
    #   random               uniform, seeded via strategy_args.seed
    #   kv_cache_aware       most free KV blocks
    #   prefix_aware         whoever already holds the prefix, unless skewed
    #   throughput_balance   smallest predicted step-time increase
    strategy: request_num_balance

    # Keyword arguments for the chosen strategy, e.g.
    #   {cache_threshold: 0.3, balance_abs_threshold: 64} for prefix_aware
    #   {seed: 0} for random
    strategy_args: {}

    # Tie-break among queued requests of the same weight version:
    # short_length | long_length | small_id. Lower versions always go first,
    # whatever this is set to.
    sort_key: short_length

    # Router-side cap on how many requests one instance may hold. 0 disables.
    # Distinct from rollout.max_concurrency, which is vLLM's max_num_seqs
    # inside the engine; this one decides eligibility before the offer.
    max_concurrent_seqs_per_instance: 0

    # Skip an instance that already has a queue of its own.
    reject_on_waiting: false

    # Pin a prompt group's responses to the instance that took the first one.
    # False matches the run this is aligned against, which scatters every
    # group across both instances.
    enable_group_sticky: false

    # Instance queue depth past which preempted requests go back to the router
    # to be placed again, possibly elsewhere. This is vLLM's
    # preemption_notification_threshold: a preempted request is requeued
    # locally first, and only surrendered once that queue is congested.
    # null leaves every preemption local.
    max_waiting_after_preempt: null

  # Idle rounds before the simulator declares livelock.
  livelock_rounds: 50

  # Safety cap on engine iterations per generate call.
  max_engine_iters: 10000

# Dynamic heterogeneous tensor parallelism for the rollout fleet.
#
# Opt-in. With enabled=false the fleet keeps the single shape rollout.n_instances
# describes and nothing under dryrun/simulator/dynamic_parallel/ is reached.
#
# When enabled, the fleet is re-shaped at every weight update: the solver decides
# each instance's TP degree, and the ROUTER decides which request goes where.
# Those are deliberately separate. The solver does not partition requests, so a
# high-TP instance is never reserved for one kind of work -- once the old-version
# tail drains, fresh work is free to use that capacity instead of leaving it idle.
# Pair this with rollout.router.strategy=version_aware_tp.
dynamic_parallel:
  # Master switch. false = the existing static homogeneous fleet, unchanged.
  enabled: false

  # GPUs the rollout fleet may spend. Every plan spends it exactly.
  n_gpus: 4

  # TP degrees the solver may use. Each needs profiled GEMM and attention tables;
  # only 1 and 2 have them today (kernel_tp4/tp8 carry collective tables only).
  tp_candidates: [1, 2]

  # search = enumerate every legal fleet and take the argmax of predicted token
  # rate. fixed = use tp_per_instance verbatim, which is how a static baseline
  # runs through this same code path.
  strategy: search

  # Only read when strategy=fixed. One TP degree per instance, e.g. [2, 1, 1].
  tp_per_instance: []

  # How strongly the solver assumes the router steers the old-version tail toward
  # high TP, in [0, 1]. version_aware_tp always prefers the highest available TP
  # for that work, so 1.0 is the matching value.
  high_tp_bias: 1.0

  # Per-TP kernel table root, required when rollout_cost.name=composed. Measured
  # tables are sharded per TP degree, so one path cannot serve every instance.
  # Example:
  #   kernel_table_roots:
  #     1: outputs/profile/qwen3_8b/kernel_tp1/kernel
  #     2: outputs/profile/qwen3_8b/kernel_tp2/kernel
  kernel_table_roots: {}

# Directory for plots and simulation outputs.
output_dir: outputs

# Whether to log per-run telemetry (instance/rollout_step/train/request JSONL
# streams) to output_dir/logs. When false, nothing is written to disk and no
# plots are generated for this run. Re-running with the same output_dir
# replaces the previous logs/ directory rather than appending to it.
log_telemetry: true

# Level for the "dryrun" logger (DEBUG, INFO, WARNING, ERROR).
log_level: INFO

# Weight-sync cost model.
sync_cost:
  # Cost model name: fixed or bandwidth.
  name: fixed

  # Fixed weight-sync time in seconds (used when name=fixed).
  sync_time: 0.0

# Log-prob recomputation cost model, the training-side forward pass. It is roughly
# a quarter of a real training block, so the 0.0 default understates every block.
recompute_cost:
  # fixed | analytical | training_forward.
  # training_forward prices it as a FLOP-derived fraction of the fitted training
  # step (1/4 under full activation recompute, plus an unembedding correction), so
  # it needs no coefficient of its own.
  name: fixed

  # Time per recomputed token in seconds (name=fixed).
  time_per_token: 0.0

  # name=analytical. peak_flops must be the ACHIEVED rate, not the datasheet
  # peak, which makes it a fitted coefficient in disguise.
  model_params: 0
  peak_flops: 312e12
  overhead_factor: 1.1

  # name=training_forward.
  hidden_size: 0
  vocab_size: 0
  parameter_count: 0
