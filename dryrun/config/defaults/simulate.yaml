defaults:
  - _self_
  - rollout_cost: roofline
  - policy: psrl
  - workload: uniform
  - training_cost: fixed

# Basic settings of one simulation job.
job:
  # Number of training versions (steps) to simulate.
  n_versions: 20

  # Prompt groups consumed per training step. Responses per step is
  # batch_size * group_size.
  batch_size: 8

  # Responses sampled per prompt (the recipe's rollout_n). null reads it from
  # the workload; only a trace carries real groups.
  group_size: null

  # Maximum allowed staleness of consumed training data.
  # Used as a version bound by areal, psrl, and roll. For verl it is the
  # sample-overage ratio fallback when policy.staleness_threshold is null.
  # Ignored by slime: its bound is policy.update_weights_interval.
  max_staleness: 2

  # Per-request prompt cap in tokens. Sampled prompts longer than this are
  # truncated. null = no cap.
  max_prompt_length: null

  # Per-request output cap in tokens. Generation stops at this length.
  # null = no cap.
  max_output_length: null

# Rollout engine settings.
rollout:
  # Number of rollout engine instances.
  n_instances: 1

  # Abort in-flight rollouts when a new weight version is published.
  partial_rollout: true

  # Per-step token budget of one instance (max tokens per engine step).
  token_budget: 8192

  # KV cache capacity in blocks, the denominator of every reported kv_cache_usage.
  # Leaving it at this placeholder makes the simulated KV curve incomparable with a
  # measured one; prefer kv_cache_sizing below.
  kv_blocks: 100000

  # Tokens per KV block.
  block_size: 16

  # Where kv_blocks should come from instead of the literal above. Leaving
  # model_path null keeps the literal.
  kv_cache_sizing:
    # A HuggingFace checkpoint dir, used to derive capacity the way vLLM does from
    # the model's KV geometry and the budget below. Overestimates by ~3%, because
    # vLLM also subtracts a measured non-KV peak no config file reveals; set
    # non_kv_overhead_bytes to fold that in once known.
    model_path: null
    gpu_memory_mib: 97871
    gpu_memory_utilization: 0.9
    tp_size: 1
    parameter_count: null
    non_kv_overhead_bytes: 0

  # Max sequences in the running batch (vLLM max_num_seqs). null = unlimited.
  max_concurrency: null

  # Admission gates applied when a request is offered to an instance.
  admission_control:
    # Reject new requests when reserved KV would exceed capacity.
    reject_if_kv_full: true

    # Reject new requests while any request is still waiting.
    reject_if_waiting: false

    # Reject new requests when the running batch is already at max_concurrency.
    reject_if_running_full: false


  # Idle rounds before the simulator declares livelock.
  livelock_rounds: 50

  # Safety cap on engine iterations per generate call.
  max_engine_iters: 10000

# Directory for plots and simulation outputs.
output_dir: outputs

# Whether to log per-run telemetry (instance/rollout_step/train/request JSONL
# streams) to output_dir/logs. When false, nothing is written to disk and no
# plots are generated for this run. Re-running with the same output_dir
# replaces the previous logs/ directory rather than appending to it.
log_telemetry: true

# Level for the "dryrun" logger (DEBUG, INFO, WARNING, ERROR).
log_level: INFO

# Weight-sync cost model.
sync_cost:
  # Cost model name: fixed or bandwidth.
  name: fixed

  # Fixed weight-sync time in seconds (used when name=fixed).
  sync_time: 0.0

# Log-prob recomputation cost model, the training-side forward pass. It is roughly
# a quarter of a real training block, so the 0.0 default understates every block.
recompute_cost:
  # fixed | analytical | training_forward.
  # training_forward prices it as a FLOP-derived fraction of the fitted training
  # step (1/4 under full activation recompute, plus an unembedding correction), so
  # it needs no coefficient of its own.
  name: fixed

  # Time per recomputed token in seconds (name=fixed).
  time_per_token: 0.0

  # name=analytical. peak_flops must be the ACHIEVED rate, not the datasheet
  # peak, which makes it a fitted coefficient in disguise.
  model_params: 0
  peak_flops: 312e12
  overhead_factor: 1.1

  # name=training_forward.
  hidden_size: 0
  vocab_size: 0
  parameter_count: 0
