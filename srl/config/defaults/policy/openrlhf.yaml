# Staleness policy name.
name: openrlhf

# Generation permits. At most this many batch_size lumps generate or await
# training at once. Above 1 requires partial_rollout_enable: true, since
# nothing else models the lock that would keep overlap from happening.
async_queue_size: 1

# False releases a permit only after the step that consumed it publishes, so
# nothing is ever in flight at a weight sync. True releases at consumption,
# letting the next lump generate while this one trains.
partial_rollout_enable: false
