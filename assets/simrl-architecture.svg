<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img"><title>How SimRL is built</title>
<style>@font-face{font-family:"Kalam";src:url("../../blog/figure-style/fonts/Kalam-Regular.ttf");font-weight:400}@font-face{font-family:"Kalam";src:url("../../blog/figure-style/fonts/Kalam-Bold.ttf");font-weight:700}@font-face{font-family:"LXGW WenKai";src:url("../../blog/figure-style/fonts/LXGWWenKai-Regular.ttf");font-weight:400}@font-face{font-family:"LXGW WenKai";src:url("../../blog/figure-style/fonts/LXGWWenKai-Regular.ttf");font-weight:700}</style>
<rect width="1600" height="1130" fill="#FFFFFF"/>
<text x="60" y="88" font-size="54" font-weight="700" fill="#252B31"><tspan x="60.00" font-family="Kalam">How SimRL is built</tspan></text>
<text x="60" y="129" font-size="31" font-weight="400" fill="#657079"><tspan x="60.00" font-family="Kalam">Profile a real system once, fit cost models to the records, then simulate on CPU.</tspan></text>
<rect x="60" y="150" width="1480" height="256" rx="4.5" fill="#E8F1FC"/>
<text x="86" y="207" font-size="36" font-weight="700" fill="#436B9E"><tspan x="86.00" font-family="Kalam">1</tspan></text>
<text x="124" y="207" font-size="36" font-weight="700" fill="#252B31"><tspan x="124.00" font-family="Kalam">Measure</tspan></text>
<text x="86" y="265" font-size="24" font-weight="400" fill="#657079"><tspan x="86.00" font-family="Kalam">srl/profiler/</tspan></text>
<text x="86" y="300" font-size="24" font-weight="700" fill="#657079"><tspan x="86.00" font-family="Kalam">needs GPUs</tspan></text>
<rect x="360" y="172" width="301.09090909090907" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="378" y="209" font-size="28" font-weight="700" fill="#436B9E"><tspan x="378.00" font-family="Kalam">training</tspan></text>
<text x="378" y="276.5" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">Megatron-Bridge</tspan></text>
<text x="378" y="307.5" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">FSDP2</tspan></text>
<rect x="689.090909090909" y="172" width="301.09090909090907" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="707.090909090909" y="211" font-size="28" font-weight="700" fill="#436B9E"><tspan x="707.09" font-family="Kalam">rollout</tspan></text>
<text x="707.090909090909" y="258.0" font-size="23" font-weight="400" fill="#657079"><tspan x="707.09" font-family="Kalam">vLLM server</tspan></text>
<text x="707.090909090909" y="293.0" font-size="23" font-weight="400" fill="#657079"><tspan x="707.09" font-family="Kalam">KV probe</tspan></text>
<text x="707.090909090909" y="326.0" font-size="23" font-weight="400" fill="#657079"><tspan x="707.09" font-family="Kalam">prefix probe</tspan></text>
<rect x="1018.181818181818" y="172" width="501.8181818181818" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="1036.181818181818" y="211" font-size="28" font-weight="700" fill="#436B9E"><tspan x="1036.18" font-family="Kalam">kernel</tspan></text>
<text x="1036.181818181818" y="260.0" font-size="23" font-weight="400" fill="#657079"><tspan x="1036.18" font-family="Kalam">attention · GEMM · collective</tspan></text>
<text x="1036.181818181818" y="293.0" font-size="23" font-weight="400" fill="#657079"><tspan x="1036.18" font-family="Kalam">elementwise · GDN · optimizer</tspan></text>
<text x="1036.181818181818" y="326.0" font-size="23" font-weight="400" fill="#657079"><tspan x="1036.18" font-family="Kalam">shape grids and holdout split</tspan></text>
<text x="360" y="393" font-size="22" font-weight="400" fill="#657079"><tspan x="360.00" font-family="Kalam">each adapter records, none of them models</tspan></text>
<rect x="60" y="490" width="1480" height="256" rx="4.5" fill="#FFF1DA"/>
<text x="86" y="547" font-size="36" font-weight="700" fill="#A2662D"><tspan x="86.00" font-family="Kalam">2</tspan></text>
<text x="124" y="549" font-size="36" font-weight="700" fill="#252B31"><tspan x="124.00" font-family="Kalam">Cost modeling</tspan></text>
<text x="86" y="605" font-size="24" font-weight="400" fill="#657079"><tspan x="86.00" font-family="Kalam">srl/cost/</tspan></text>
<text x="86" y="638" font-size="24" font-weight="700" fill="#657079"><tspan x="86.00" font-family="Kalam">no GPU</tspan></text>
<rect x="360" y="512" width="368.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="378" y="551" font-size="28" font-weight="700" fill="#A2662D"><tspan x="378.00" font-family="Kalam">rollout cost</tspan></text>
<text x="378" y="600.0" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">roofline</tspan></text>
<text x="378" y="633.0" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">composed kernel sum</tspan></text>
<text x="378" y="666.0" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">DistServe · PSRL fitted</tspan></text>
<rect x="756.0" y="512" width="368.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="774.0" y="549" font-size="28" font-weight="700" fill="#A2662D"><tspan x="774.00" font-family="Kalam">training cost</tspan></text>
<text x="774.0" y="600.0" font-size="23" font-weight="400" fill="#657079"><tspan x="774.00" font-family="Kalam">fixed · analytical · linear</tspan></text>
<text x="774.0" y="633.0" font-size="23" font-weight="400" fill="#657079"><tspan x="774.00" font-family="Kalam">Hydraulis</tspan></text>
<text x="774.0" y="666.0" font-size="23" font-weight="400" fill="#657079"><tspan x="774.00" font-family="Kalam">FSDP latency and memory</tspan></text>
<rect x="1152.0" y="512" width="368.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="1170.0" y="551" font-size="28" font-weight="700" fill="#A2662D"><tspan x="1170.00" font-family="Kalam">kernel database</tspan></text>
<text x="1170.0" y="600.0" font-size="23" font-weight="400" fill="#657079"><tspan x="1170.00" font-family="Kalam">measured cubes</tspan></text>
<text x="1170.0" y="633.0" font-size="23" font-weight="400" fill="#657079"><tspan x="1170.00" font-family="Kalam">speed-of-light</tspan></text>
<text x="1170.0" y="666.0" font-size="23" font-weight="400" fill="#657079"><tspan x="1170.00" font-family="Kalam">utility surfaces</tspan></text>
<text x="360" y="733" font-size="22" font-weight="400" fill="#657079"><tspan x="360.00" font-family="Kalam">each model interpolates inside its fitted domain</tspan></text>
<rect x="60" y="830" width="1480" height="256" rx="4.5" fill="#EAF4EF"/>
<text x="86" y="887" font-size="36" font-weight="700" fill="#387F70"><tspan x="86.00" font-family="Kalam">3</tspan></text>
<text x="124" y="889" font-size="36" font-weight="700" fill="#252B31"><tspan x="124.00" font-family="Kalam">Simulate</tspan></text>
<text x="86" y="945" font-size="24" font-weight="400" fill="#657079"><tspan x="86.00" font-family="Kalam">srl/simulator/</tspan></text>
<text x="86" y="978" font-size="24" font-weight="700" fill="#657079"><tspan x="86.00" font-family="Kalam">no GPU</tspan></text>
<rect x="360" y="852" width="269.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="378" y="891" font-size="28" font-weight="700" fill="#387F70"><tspan x="378.00" font-family="Kalam">simulator</tspan></text>
<text x="378" y="940.0" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">discrete-event loop</tspan></text>
<text x="378" y="973.0" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">two backends</tspan></text>
<text x="378" y="1006.0" font-size="23" font-weight="400" fill="#657079"><tspan x="378.00" font-family="Kalam">C++ and Python</tspan></text>
<rect x="657.0" y="852" width="269.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="675.0" y="891" font-size="28" font-weight="700" fill="#387F70"><tspan x="675.00" font-family="Kalam">policy</tspan></text>
<text x="675.0" y="938.0" font-size="23" font-weight="400" fill="#657079"><tspan x="675.00" font-family="Kalam">10+ system presets</tspan></text>
<text x="675.0" y="973.0" font-size="23" font-weight="400" fill="#657079"><tspan x="675.00" font-family="Kalam">L1 · L2 · L3 controls</tspan></text>
<text x="675.0" y="1006.0" font-size="23" font-weight="400" fill="#657079"><tspan x="675.00" font-family="Kalam">staleness rules</tspan></text>
<rect x="954.0" y="852" width="269.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="972.0" y="887" font-size="28" font-weight="700" fill="#387F70"><tspan x="972.00" font-family="Kalam">component</tspan></text>
<text x="972.0" y="940.0" font-size="23" font-weight="400" fill="#657079"><tspan x="972.00" font-family="Kalam">rollout engine</tspan></text>
<text x="972.0" y="969.0" font-size="23" font-weight="400" fill="#657079"><tspan x="972.00" font-family="Kalam">router</tspan></text>
<text x="972.0" y="1002.0" font-size="23" font-weight="400" fill="#657079"><tspan x="972.00" font-family="Kalam">recompute · sync</tspan></text>
<rect x="1251.0" y="852" width="269.0" height="180" rx="7.2" fill="#FFFFFF" stroke="#D1D8DD" stroke-width="1.8"/>
<text x="1269.0" y="891" font-size="28" font-weight="700" fill="#387F70"><tspan x="1269.00" font-family="Kalam">workload</tspan></text>
<text x="1269.0" y="956.5" font-size="23" font-weight="400" fill="#657079"><tspan x="1269.00" font-family="Kalam">grouped traces</tspan></text>
<text x="1269.0" y="989.5" font-size="23" font-weight="400" fill="#657079"><tspan x="1269.00" font-family="Kalam">length models</tspan></text>
<text x="360" y="1073" font-size="22" font-weight="400" fill="#657079"><tspan x="360.00" font-family="Kalam">every duration comes from a cost model</tspan></text>
