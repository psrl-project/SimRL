<path d="M 470 868 Q 466.27 861.49 462.54679793234396 854.9827123048352" fill="none" stroke="#657079" stroke-width="3"/>
<path d="M 470 868 Q 473.73 861.49 477.45320206765604 854.9827123048352" fill="none" stroke="#657079" stroke-width="3"/>
<text x="500" y="849.0" font-size="24" font-weight="400" fill="#657079"><tspan x="500.00" font-family="Kalam">Python / C++ API</tspan></text>
</svg>