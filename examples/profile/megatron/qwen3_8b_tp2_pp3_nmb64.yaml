# Extends the TP2/PP3 sweep to the microbatch count the PSRL baseline actually runs.
#
# The baseline trains 64 responses per step with ppo_micro_batch_size_per_gpu=1
# and DP=1, so a step is 64 microbatches and `pipeline_slots` is 64 + 3 - 1 = 66.
# The {1, 4} sweep tops out at 6, and extrapolating that 11x overpredicted the
# measured steps by 21.7% on average. The latency form is linear in slots, so the
# fix is to measure a point at the real count rather than stretch to it.
#
# Kept as a separate config so the cheap bring-up sweep stays cheap: a 64-microbatch
# candidate at 12288 tokens is roughly 200 s per step against 8.7 s at one microbatch.
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy/share_303760348/lhy/models/Qwen3-8B}

hardware:
  gpu_name: H20
  gpu_count: 6
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

# Same tree as the base sweep, so `collect` merges both into one JSONL and the
# fit sees {1, 4, 64} as three microbatch counts on one mesh.
output_dir: ../../../outputs/profile/qwen3_8b/megatron_tp2_pp3

training:
  compute_dtype: bf16
  optimizer: adam
  parameter_dtype: bf16
  gradient_dtype: fp32
  optimizer_state_dtype: fp32
  distributed_optimizer: true
  # Six steps with two discarded rather than twelve with four. At 64 microbatches
  # a step costs 8-200 s instead of well under a second, so the fixed ~150 s of
  # distributed setup is no longer what dominates a candidate and the extra
  # samples stop being nearly free. Four retained samples still give a median.
  max_steps: 6
  warmup_steps: 2

profiling:
  # A 64-microbatch candidate at the top sequence length may not fit. Recording
  # the OOM is more useful than aborting the sweep: the memory model reads OOM
  # points as upper bounds, and the latency fit only needs the cells that ran.
  allow_incomplete: true

environment:
  HF_HUB_OFFLINE: "1"

search_space:
  tensor_parallel_sizes: [2]
  pipeline_parallel_sizes: [3]
  micro_batch_size: 1
  num_microbatches: [64]
  sequence_lengths: [1024, 2048, 4096, 8192, 12288]
  recompute: full
