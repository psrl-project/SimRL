# Measures the corner the rest of the grid leaves empty: many microbatches AND
# long sequences at the same time.
#
# The three sibling configs between them cover num_microbatches {1, 4, 64} and
# sequence lengths up to 12288, but never together: long sequences were measured
# only at one microbatch, and 64 microbatches only up to 4096 tokens. The
# quadratic feature `sum_squared_tokens` is a batch total, so it is the product
# of those two axes, and a design where they never co-vary cannot identify it.
#
# The consequence was measurable. Fitted without this corner, the model scored
# 3.4% held-out error yet overpredicted a real 64-microbatch step by 49.5%, with
# 79 s of a 110 s prediction coming from the quadratic term alone. The real
# batch's quadratic feature is 37x larger than anything the grid contained.
#
# One candidate would make the corner non-empty; three give the token axis a
# slope there, so the quadratic coefficient is identified rather than merely
# constrained at a point.
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy/share_303760348/lhy/models/Qwen3-8B}

hardware:
  gpu_name: H20
  gpu_count: 6
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

output_dir: ../../../outputs/profile/qwen3_8b/megatron_pp_scaling

training:
  compute_dtype: bf16
  optimizer: adam
  parameter_dtype: bf16
  gradient_dtype: fp32
  optimizer_state_dtype: fp32
  distributed_optimizer: true
  # Six steps, two discarded. The sibling configs use twelve and four, but a
  # 64-microbatch step at 8192-12288 tokens runs 30-75 s, so twelve steps would
  # cost 15 minutes per candidate. Four retained steps still support a median.
  max_steps: 6
  warmup_steps: 2

profiling:
  allow_incomplete: false

environment:
  HF_HUB_OFFLINE: "1"

# PP=3 only, which is the mesh the baseline actually runs. The per-layer form is
# already validated across PP {1, 2, 3} by the sibling sweep, so this config
# spends its budget on the empty corner rather than re-confirming PP transfer.
#
# 6144 to 12288 brackets the real run's mean total length of 9428, so the
# baseline's batch is interpolation on both token axes at once.
search_space:
  tensor_parallel_sizes: [2]
  pipeline_parallel_sizes: [3]
  data_parallel_sizes: [1]
  micro_batch_size: 1
  num_microbatches: [64]
  sequence_lengths: [6144, 9216, 12288]
  recompute: full
