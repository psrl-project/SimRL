# Profiles the exact training mesh of the PSRL baseline run
# (psrl/examples/dapo_trainer/qwen3_8b_megatron_simulate.sh): TP=2, PP=3, CP=1
# on 6 GPUs, which gives DP=1.
#
# The production sweep (qwen3_8b.yaml) covers TP/PP in {1,4,8}x{1,4} and so has
# no TP2/PP3 cell. `CostArtifact.entry_for` matches the mesh exactly and raises
# rather than interpolating across topologies, so simulating the baseline needs
# this cell measured rather than inferred.
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy/share_303760348/lhy/models/Qwen3-8B}

# gpu_count is the fixed world size. DP = world_size / (TP * PP) = 6 / (2*3) = 1,
# matching the baseline's train_ngpus_per_node=6.
hardware:
  gpu_name: H20
  gpu_count: 6
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

output_dir: ../../../outputs/profile/qwen3_8b/megatron_tp2_pp3

training:
  compute_dtype: bf16
  optimizer: adam
  parameter_dtype: bf16
  gradient_dtype: fp32
  optimizer_state_dtype: fp32
  distributed_optimizer: true
  # Twelve steps with four discarded, per the production config's rationale:
  # one warmup step does not reach steady state, and eight retained samples
  # allow a median where two would not.
  max_steps: 12
  warmup_steps: 4

profiling:
  allow_incomplete: false

environment:
  HF_HUB_OFFLINE: "1"

# One mesh, so the design rank has to come from the workload columns alone. The
# latency row is [1, slots * tokens, slots] with slots = num_microbatches + PP - 1,
# so two microbatch counts are mandatory: a single count leaves the slot column
# collinear with the intercept and caps the design at rank two where the fit needs
# three. {1, 4} opens the slot lever wider than {1, 2} for the same candidate count.
#
# Sequence lengths reach 12288 deliberately. The baseline caps a trajectory at
# prompt 1024 + response 10240 = 11264 tokens, and `tokens` is gated on the LARGEST
# microbatch rather than the mean, so a sweep topping out at 8192 would force
# EXTRAPOLATE=[tokens] on the tail of every step. Since attention is quadratic in
# sequence length while the fitted form is linear plus a quadratic token term,
# covering 11264 outright is worth the two extra candidates.
# The baseline itself runs 64 microbatches, which is what
# qwen3_8b_tp2_pp3_nmb64.yaml measures. Collect both into this tree so the fit
# sees {1, 4, 64} and the real count is in-domain rather than an 11x stretch.
search_space:
  tensor_parallel_sizes: [2]
  pipeline_parallel_sizes: [3]
  micro_batch_size: 1
  num_microbatches: [1, 4]
  sequence_lengths: [1024, 2048, 4096, 8192, 12288]
  recompute: full
