# HuggingFace checkpoint. Architecture fields are read from config.json / AutoConfig.
model: ${oc.env:MODEL_PATH,/path/to/Qwen3-8B}

# gpu_count is the fixed world size. DP = world_size / (TP * PP).
hardware:
  gpu_name: H20
  gpu_count: 8
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

output_dir: ../../../outputs/profile/qwen3_8b/megatron_bridge

training:
  compute_dtype: bf16
  optimizer: adam
  parameter_dtype: bf16
  gradient_dtype: fp32
  optimizer_state_dtype: fp32
  distributed_optimizer: true
  # Twelve steps with four discarded. The first profiled step was the slowest in 18 of
  # 24 runs under a single warmup step (chance alone would give about 8) so one step
  # is not enough to reach steady state. Dropping the second step as well cut the median
  # spread across a candidate from 16.4% to 0.5%. Eight retained samples then allow a
  # median and outlier rejection, which two samples cannot. The extra steps are nearly
  # free: a candidate spends about 2.5 minutes in distributed setup and well under a
  # second per step.
  max_steps: 12
  warmup_steps: 4

profiling:
  allow_incomplete: false

environment:
  # The library recipe reads one config.json through the hub identifier it pins.
  # Resolving it from the local cache keeps a candidate from depending on network
  # reachability; model weights are never fetched (load_weights=false).
  HF_HUB_OFFLINE: "1"

# Bring-up sweep, not the production sweep.
#
# The latency design row is [1, slots * tokens, slots] with slots = num_microbatches +
# PP - 1, separating the per-step cost, token-proportional work, and the per-microbatch
# fixed cost. At a fixed microbatch count the slot column is constant and therefore
# collinear with the intercept, so any number of sequence lengths alone caps the design
# at rank two where the fit needs rank three. Reaching it requires at least two sequence
# lengths AND two microbatch counts.
#
# Do not prune below two sequence lengths or two microbatch counts. Measured on synthetic
# data at 1% step-time noise, {1, 4} recovers the coefficients better than {1, 2} (worst
# coefficient 21.5% against 38.3%) for the same candidate count, because it opens the slot
# lever wider. A third microbatch count buys nothing: rank stays three and the prediction
# error does not improve, so it is 50% more candidates for no gain.
#
# The fitted feature_ranges are hard out-of-domain gates at prediction time, and the
# `tokens` feature is the LARGEST microbatch rather than the mean, so one long sequence in
# a batch sets it. The DAPO trace's median sequence is 8828 tokens (prompt 138 + output
# 8690) and its longest is 11133, so 2048 was 5.4x too small and every step raised
# TrainingOutOfDomainError. 8192 covers the bulk and leaves a 1.36x extrapolation at the
# tail, which is run with EXTRAPOLATE=[tokens].
#
# That extrapolation is deliberately bounded rather than free. The formula is linear in
# tokens while attention is quadratic in sequence length, so a linear stretch understates
# the tail: attention is 13.3% of a layer's FLOPs at 8192 and 17.3% at 11133, about four
# points of work the fit cannot see. Stretching from 2048 instead would have tripled that
# share. Extend to 11264 if the tail ever needs to be trusted rather than bounded.
#
# The (TP, PP) pairs below cover pure data parallelism, the recipe's recommended topology,
# maximum tensor parallelism, and the only pipeline depth that exercises the bubble terms.
search_space:
  tensor_parallel_sizes: [1, 4, 8]
  pipeline_parallel_sizes: [1, 4]
  micro_batch_size: 1
  # Local microbatches per DP rank. GBS = MBS * DP * num_microbatches.
  num_microbatches: [1, 4]
  sequence_lengths: [512, 1024, 2048, 4096, 8192]
  recompute: full
