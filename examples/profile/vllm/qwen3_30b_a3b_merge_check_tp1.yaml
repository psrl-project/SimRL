# Real end-to-end decode-step verification for Qwen3-30B-A3B (MoE), mirroring
# qwen35_27b_merge_check_tp1.yaml. max-model-len is capped at 40960, well under this
# checkpoint's real max_position_embeddings (63488) and comfortably above the largest
# input+output length used here (25000 + 100).
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy10/share_303541817/lhy/models/Qwen3-30B-A3B}

hardware:
  gpu_name: H20
  gpu_count: 1
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

output_dir: ../../../outputs/profile/qwen3_30b_a3b/vllm_merge_check_tp1
experiment_name: qwen3-30b-a3b-merge-check
num_runs: 1
server_ready_timeout: 1800

run:
  max_parallel: 1
  max_concurrent_startups: 1

serve:
  args:
    dtype: bfloat16
    max-model-len: 40960
    max-num-batched-tokens: 32768
    gpu-memory-utilization: 0.9
  parameters:
    - tensor-parallel-size: 1
      pipeline-parallel-size: 1
      max-num-seqs: 256

bench:
  args:
    request-rate: "inf"
    random-range-ratio: 0.0
    seed: 42

phases:
  decode:
    parameters:
      - {random-input-len: 4000,  random-output-len: 100, max-concurrency: 20, num-prompts: 20}
      - {random-input-len: 12000, random-output-len: 100, max-concurrency: 20, num-prompts: 20}
      - {random-input-len: 25000, random-output-len: 100, max-concurrency: 20, num-prompts: 20}
