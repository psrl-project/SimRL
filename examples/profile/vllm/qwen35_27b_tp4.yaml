# Qwen3.5-27B rollout profile at TP4. Context lengths reach 128k, so the grid is
# narrower at long contexts: one 126k prompt already fills the KV cache at low tensor
# parallelism, and a decode point that overfills it is truncated at its first preemption.
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy10/share_303541817/lhy/models/Qwen3.8-27B}

hardware:
  gpu_name: H20
  gpu_count: 4
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

output_dir: ../../../outputs/profile/qwen35_27b/vllm_tp4
experiment_name: qwen35-27b
num_runs: 1
server_ready_timeout: 1800

run:
  max_parallel: 1
  max_concurrent_startups: 1

serve:
  args:
    dtype: bfloat16
    max-model-len: 131072
    max-num-batched-tokens: 32768
    gpu-memory-utilization: 0.9
  parameters:
    - tensor-parallel-size: 4
      pipeline-parallel-size: 1
      max-num-seqs: 256

bench:
  args:
    request-rate: "inf"
    random-range-ratio: 0.0
    seed: 42

phases:
  prefill:
    parameters:
      - {random-input-len: 1024,   random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 1024,   random-output-len: 1, max-concurrency: 8,  num-prompts: 8}
      - {random-input-len: 1024,   random-output-len: 1, max-concurrency: 32, num-prompts: 32}
      - {random-input-len: 1024,   random-output-len: 1, max-concurrency: 64, num-prompts: 64}
      - {random-input-len: 4096,   random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 4096,   random-output-len: 1, max-concurrency: 8,  num-prompts: 8}
      - {random-input-len: 4096,   random-output-len: 1, max-concurrency: 32, num-prompts: 32}
      - {random-input-len: 4096,   random-output-len: 1, max-concurrency: 64, num-prompts: 64}
      - {random-input-len: 16384,  random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 16384,  random-output-len: 1, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 16384,  random-output-len: 1, max-concurrency: 16, num-prompts: 16}
      - {random-input-len: 16384,  random-output-len: 1, max-concurrency: 32, num-prompts: 32}
      - {random-input-len: 32768,  random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 32768,  random-output-len: 1, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 32768,  random-output-len: 1, max-concurrency: 16, num-prompts: 16}
      - {random-input-len: 65536,  random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 65536,  random-output-len: 1, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 65536,  random-output-len: 1, max-concurrency: 8,  num-prompts: 8}
      - {random-input-len: 98304,  random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 98304,  random-output-len: 1, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 126976, random-output-len: 1, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 126976, random-output-len: 1, max-concurrency: 2,  num-prompts: 2}
  decode:
    parameters:
      - {random-input-len: 1024,   random-output-len: 8192, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 1024,   random-output-len: 8192, max-concurrency: 8,  num-prompts: 8}
      - {random-input-len: 1024,   random-output-len: 8192, max-concurrency: 32, num-prompts: 32}
      - {random-input-len: 16384,  random-output-len: 8192, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 16384,  random-output-len: 8192, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 16384,  random-output-len: 8192, max-concurrency: 16, num-prompts: 16}
      - {random-input-len: 32768,  random-output-len: 8192, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 32768,  random-output-len: 8192, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 32768,  random-output-len: 8192, max-concurrency: 8,  num-prompts: 8}
      - {random-input-len: 65536,  random-output-len: 8192, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 65536,  random-output-len: 8192, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 65536,  random-output-len: 8192, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 98304,  random-output-len: 8192, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 98304,  random-output-len: 8192, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 114688, random-output-len: 8192, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 114688, random-output-len: 8192, max-concurrency: 2,  num-prompts: 2}
