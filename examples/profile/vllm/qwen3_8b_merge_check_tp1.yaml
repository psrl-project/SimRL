# Real end-to-end decode-step verification for Qwen3-8B TP1, mirroring the 27B/MoE
# merge-check configs. residents=1/2/4 (low load) and 20 (the same anchor used for the
# 27B dense/MoE comparisons) at the same three context lengths.
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy10/share_303541817/lhy/models/Qwen3-8B}

hardware:
  gpu_name: H20
  gpu_count: 1
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink

output_dir: ../../../outputs/profile/qwen3_8b/vllm_merge_check_tp1
experiment_name: qwen3-8b-merge-check
num_runs: 1
server_ready_timeout: 1800

run:
  max_parallel: 1
  max_concurrent_startups: 1

serve:
  args:
    dtype: bfloat16
    max-model-len: 32768
    max-num-batched-tokens: 32768
    gpu-memory-utilization: 0.9
  parameters:
    - tensor-parallel-size: 1
      pipeline-parallel-size: 1
      max-num-seqs: 256

bench:
  args:
    request-rate: "inf"
    random-range-ratio: 0.0
    seed: 42

phases:
  decode:
    parameters:
      - {random-input-len: 4000,  random-output-len: 100, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 4000,  random-output-len: 100, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 4000,  random-output-len: 100, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 4000,  random-output-len: 100, max-concurrency: 20, num-prompts: 20}
      - {random-input-len: 12000, random-output-len: 100, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 12000, random-output-len: 100, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 12000, random-output-len: 100, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 12000, random-output-len: 100, max-concurrency: 20, num-prompts: 20}
      - {random-input-len: 25000, random-output-len: 100, max-concurrency: 1,  num-prompts: 1}
      - {random-input-len: 25000, random-output-len: 100, max-concurrency: 2,  num-prompts: 2}
      - {random-input-len: 25000, random-output-len: 100, max-concurrency: 4,  num-prompts: 4}
      - {random-input-len: 25000, random-output-len: 100, max-concurrency: 20, num-prompts: 20}
