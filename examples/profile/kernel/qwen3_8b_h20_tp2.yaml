# HuggingFace checkpoint. Set MODEL_PATH, or edit this line; the default is a
# placeholder and will not resolve.
model: ${oc.env:MODEL_PATH,/path/to/Qwen3-8B}
hardware:
  gpu_name: H20
  gpu_count: 2
  gpu_memory_mib: 97871
output_dir: ../../../outputs/profile/qwen3_8b/kernel_tp2
experiment_name: qwen3-8b
parallelism:
  tensor_parallel: 2

gemm:
  # Powers of two plus the non-power-of-two token counts that appear in the THD
  # validation records: 3072, 6144, 7510, 10240, 11264, 12288, 22528. Without them,
  # wgrad queries with k=token_count would raise KernelCoverageError for shapes in
  # the validation set, blocking end-to-end scoring of ComposedTraining.
  token_counts: [1, 2, 4, 8, 16, 32, 48, 64, 128, 256, 512, 1024, 2048, 3072, 4096, 6144, 7510, 8192, 10240, 11264, 12288, 16384, 22528]

attention:
  batch_sizes: [1, 2, 4, 8, 16, 32, 48, 64]
  context_seq_lens: [128, 256, 512, 1024, 2048, 4096, 8192, 16384]
  generation_steps: [0, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
  block_size: 16
  window_size: 0
  max_context_tokens: 262144

elementwise:
  token_counts: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]

optimizer:
  # Parameter counts, not token counts: an Adam step reads and writes the optimizer state
  # once per step regardless of how many tokens produced the gradients. The grid brackets
  # `total_parameters / (tp * pp * dp)`, which is the shard one rank updates. Qwen3-8B at
  # tp=2/pp=3/dp=1 gives 1.365B; the smaller points cover higher parallelism degrees and a
  # distributed optimizer dividing again across DP, and the sub-10M points exist to locate
  # the launch floor rather than because any real shard is that small.
  #
  # The ceiling is 2.048B, not higher: a shard needs ~18 bytes per parameter for its
  # parameter, gradient and fp32 state, so 4.096B wants 115 GiB against H20's 95 GiB. The
  # first sweep included that point, the allocation OOM'd inside TE, and the timed step then
  # measured an empty update at an implied 190 TB/s. `profiler/kernels/optimizer.py` now
  # refuses such a point rather than recording it.
  param_counts: [1000000, 2000000, 5000000, 10000000, 20000000, 50000000, 100000000,
     200000000, 341000000, 512000000, 683000000, 1024000000, 1365000000, 2048000000]

collective:
  # Message sizes are swept directly rather than derived from token counts: the five
  # collectives do not carry the same size at the same token count. An SP-sharded
  # reduce_scatter moves tokens*hidden/tp where an all_reduce moves tokens*hidden, and a
  # Megatron gradient bucket is unrelated to tokens entirely (it buckets at
  # max(40M, 1M*dp) *parameters*, so Qwen3-8B reduces ~205 buckets of ~153 MiB). The grid
  # spans 4 KiB to 512 MiB, which covers all three regimes.
  message_bytes: [4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152,
     4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456, 536870912]
  # (world_size, nodes) pairs. Every collective is timed inside one process group per
  # topology, because group setup dominates a small-message measurement. `nodes` is a slice
  # column, so an unmeasured topology raises rather than interpolating from another one.
  topologies: [[2, 1], [4, 1], [8, 1]]
  # float32 is not optional: Megatron reduces gradients in fp32, so a bf16-only table
  # cannot price the data-parallel reduction.
  dtypes: [bfloat16, float32]

measurement:
  warmup_iterations: 5
  active_iterations: 20
  dtype: bfloat16
  kv_cache_dtype: bfloat16
