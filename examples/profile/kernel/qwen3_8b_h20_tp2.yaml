# HuggingFace checkpoint. Set MODEL_PATH, or edit this line; the default is a
# placeholder and will not resolve.
model: ${oc.env:MODEL_PATH,/path/to/Qwen3-8B}
hardware:
  gpu_name: H20
  gpu_count: 2
  gpu_memory_mib: 97871
output_dir: ../../../outputs/profile/qwen3_8b/kernel_tp2
experiment_name: qwen3-8b
parallelism:
  tensor_parallel: 2

gemm:
  token_counts: [1, 2, 4, 8, 16, 32, 48, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]

