# Collective-only config. The tp=4 and tp=8 sweeps exist to complete the all_reduce
# `world_size` slices, which cannot be interpolated: a 2-rank all-reduce and an 8-rank one run
# different schedules over different link topologies, so `world_size` is a slice column and each
# degree needs its own measurement. Run with FAMILY=collective.
#
# GEMM/attention/elementwise are absent from this file, but `output_dir`'s `kernel/h20/{gemm,
# attention,elementwise}` tables are already populated (composed rollout is scored at tp=4, e.g.
# `workflow/validate/experiments/real_dapo_tail.py`'s TP sweep) -- they predate this file's
# collective-only trim and were never re-swept here, not evidence they are unneeded.
# `kernel/h20/collective` itself was lost to a since-fixed symlink/fit-floor mishap
# (`memory/fit-floor-writes-through-symlinked-table-dirs.md`) and restored on 2026-10-23 via
# `cp -a` from `kernel_tp2/kernel/h20/collective`, which already covers world_size 2/4/8 in one
# table -- not a fresh sweep of this file.
model: ${oc.env:MODEL_PATH,/path/to/Qwen3-8B}
hardware:
  gpu_name: H20
  gpu_count: 4
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink
output_dir: ../../../outputs/profile/qwen3_8b/kernel_tp4
experiment_name: qwen3-8b
parallelism:
  tensor_parallel: 4

collective:
  # Message sizes are swept directly rather than derived from token counts: the five
  # collectives do not carry the same size at the same token count. An SP-sharded
  # reduce_scatter moves tokens*hidden/tp where an all_reduce moves tokens*hidden, and a
  # Megatron gradient bucket is unrelated to tokens entirely (it buckets at
  # max(40M, 1M*dp) *parameters*, so Qwen3-8B reduces ~205 buckets of ~153 MiB). The grid
  # spans 4 KiB to 512 MiB, which covers all three regimes.
  message_bytes: [4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576, 2097152,
     4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456, 536870912]
  # (world_size, nodes) pairs. Every collective is timed inside one process group per
  # topology, because group setup dominates a small-message measurement. `nodes` is a slice
  # column, so an unmeasured topology raises rather than interpolating from another one.
  topologies: [[2, 1], [4, 1], [8, 1]]
  # float32 is not optional: Megatron reduces gradients in fp32, so a bf16-only table
  # cannot price the data-parallel reduction.
  dtypes: [bfloat16, float32]

measurement:
  warmup_iterations: 5
  active_iterations: 20
  dtype: bfloat16
  kv_cache_dtype: bfloat16
