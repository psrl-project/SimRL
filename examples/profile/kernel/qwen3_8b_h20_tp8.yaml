# Collective-only config. See qwen3_8b_h20_tp4.yaml for why GEMM and attention are absent.
# At eight ranks NCCL symmetric memory becomes reachable (it needs world_size >= 4) and vLLM's
# custom all-reduce is clamped to 256 KiB, so this is the degree where the dispatch is expected
# to split across backends by message size. `kernel_source` records which one fired.
model: ${oc.env:MODEL_PATH,/path/to/Qwen3-8B}
hardware:
  gpu_name: H20
  gpu_count: 8
  gpu_memory_mib: 97871
  node_count: 1
  gpus_per_node: 8
  interconnect: NVLink
output_dir: ../../../outputs/profile/qwen3_8b/kernel_tp8
experiment_name: qwen3-8b
parallelism:
  tensor_parallel: 8

collective:
  token_counts: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]

measurement:
  warmup_iterations: 5
  active_iterations: 20
  dtype: bfloat16
  kv_cache_dtype: bfloat16
