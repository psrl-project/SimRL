# Kernel profiling for Qwen3-30B-A3B at TP=2.
#
# See `qwen3_30b_a3b_h20_tp1.yaml` for why the family is `qwen3_moe` (plain attention, no
# shared expert) and why the generation-step grid is capped at 32768, not 131072.
model: ${oc.env:MODEL_PATH,/apdcephfs_zwfy10/share_303541817/lhy/models/Qwen3-30B-A3B}
hardware:
  gpu_name: H20
  gpu_count: 2
  gpu_memory_mib: 97871
output_dir: ../../../outputs/profile/qwen3_30b_a3b/kernel_tp2
experiment_name: qwen3-30b-a3b
parallelism:
  tensor_parallel: 2

gemm:
  token_counts: [1, 2, 4, 8, 16, 32, 48, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]

moe:
  # Routed-MoE grouped GEMM (`fused_experts`). One axis spans both decode- and prefill-shaped
  # regimes: unlike `gdn:`, there is no phase split here (see `cost/kernel/ops/moe.py`).
  num_tokens: [1, 2, 4, 8, 16, 32, 48, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]

attention:
  batch_sizes: [1, 2, 4, 8, 16, 32, 48, 64]
  context_seq_lens: [128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
  generation_steps: [0, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
  block_size: 16
  window_size: 0
  max_context_tokens: 65536

elementwise:
  token_counts: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384]

collective:
  message_bytes: [4096, 65536, 524288, 4194304, 33554432, 134217728, 536870912]
  topologies: [[2, 1], [4, 1], [8, 1]]
  dtypes: [bfloat16, float32]

measurement:
  warmup_iterations: 5
  active_iterations: 20
  dtype: bfloat16
  kv_cache_dtype: bfloat16
