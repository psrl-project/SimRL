[project]
name = "simrl"
version = "0.1.0"
description = "Async disaggregate RL training simulator"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "tqdm>=4.0",
    "pyarrow>=14",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0",
    "ruff>=0.12",
]
profile = []

[project.scripts]
srl = "srl.cli.main:main"
srl-profile = "srl.cli.profile:main"
srl-regress = "srl.cli.regress:main"
srl-plot = "srl.cli.plot:main"
srl-psrl-plot = "srl.cli.psrl_plot:main"
srl-compare = "srl.cli.compare:main"
srl-workload = "srl.cli.workload:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["srl*"]

[tool.setuptools.package-data]
"srl.cost.kernel" = ["data/*.yaml"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["srl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
